<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈 - 상품 목록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        #home-button {
            position: fixed;
            top: 0;
            left: 40px;
            background-color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #ddd;
            z-index: 1000;
            height: 24px;
        }
        #home-button a {
            text-decoration: none;
            color: #007bff;
            font-size: 16px;
        }
        #home-button a:hover {
            text-decoration: underline;
        }
        #auth-buttons {
            position: fixed;
            top: 0;
            right: 40px;
            background-color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #ddd;
            z-index: 1000;
            height: 24px; /* 명시적 높이 설정 */
        }
        #auth-buttons button {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
        }
        #user-info {
            position: fixed;
            top: 0;
            right: 40px;
            background-color: white;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #ddd;
            z-index: 1000;
        }
        .menu-button {
            cursor: pointer;
            font-size: 16px;
            padding: 5px 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #user-menu {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            width: 150px;
        }
        #user-menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
        }
        #user-menu a:hover { background: #f0f0f0; }
        #content {
            margin-top: 60px;
            padding: 40px;
        }
        #product-list {
            margin-top: 10px;
        }
        .product-item {
            cursor: pointer;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .product-item:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>
<div id="home-button">
    <a href="/">Home</a>
</div>

<div id="auth-buttons">
    <button onclick="location.href='/login.html'">로그인</button>
    <button onclick="location.href='/signup.html'">회원가입</button>
</div>

<div id="user-info">
    <span id="username"></span>
    <span id="user-cash"></span>
    <button class="menu-button" id="menu-btn">메뉴</button>
    <div id="user-menu"></div>
</div>

<div id="content">
    <h1>상품 목록</h1>
    <div id="product-list"></div>
</div>

<script>
    async function loadUserInfo() {
        const authButtons = document.getElementById("auth-buttons");
        const userInfo = document.getElementById("user-info");
        const userMenu = document.getElementById("user-menu");
        const usernameElem = document.getElementById("username");
        const userCashElem = document.getElementById("user-cash");

        try {
            const userResponse = await fetch("/api/v1/user");
            if (!userResponse.ok) throw new Error("Unauthorized");

            const user = await userResponse.json();
            authButtons.style.display = "none";
            userInfo.style.display = "flex";
            usernameElem.innerText = user.name;
            userCashElem.innerText = `캐시: ${user.cash.toLocaleString()}원`;

            userMenu.innerHTML = user.role === "seller" ? `
                <a href="/register-product.html">상품 추가</a>
                <a href="/manage-products.html">상품 관리</a>
                <a href="/profile.html">정보 관리</a>
                <a href="#" onclick="logout()">로그아웃</a>
            ` : `
                <a href="/charge.html">캐시 충전</a>
                <a href="/orders.html">주문 내역</a>
                <a href="/profile.html">정보 관리</a>
                <a href="#" onclick="logout()">로그아웃</a>
            `;
        } catch (error) {
            authButtons.style.display = "flex";
            userInfo.style.display = "none";
        }
    }

    async function loadProducts() {
        try {
            const productResponse = await fetch("/api/v1/products");
            if (!productResponse.ok) throw new Error("상품을 불러오지 못했습니다.");
            const productData = await productResponse.json();
            const productList = document.getElementById("product-list");
            productList.innerHTML = "";
            productData.products.forEach(product => {
                const item = document.createElement("div");
                item.className = "product-item";
                item.innerHTML = `<span>${product.name}</span><span>${product.price.toLocaleString()}원</span>`;
                item.onclick = () => location.href = `/product-detail.html?name=${encodeURIComponent(product.name)}`;
                productList.appendChild(item);
            });
        } catch (error) {
            alert(error.message);
        }
    }

    function logout() {
        fetch("/api/v1/logout", { method: "POST" })
            .then(() => window.location.href = "/login.html");
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadUserInfo();
        loadProducts();
        document.getElementById("menu-btn").addEventListener("click", (event) => {
            event.stopPropagation();
            const menu = document.getElementById("user-menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        });
        document.addEventListener("click", (event) => {
            if (!event.target.closest("#user-info")) {
                document.getElementById("user-menu").style.display = "none";
            }
        });
    });
</script>
</body>
</html>
