<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈 - 상품 목록</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/product-list.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
<div id="top-bar">
    <div id="home-button">
        <a href="/home.html">Home</a>
    </div>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="상품 검색..." aria-label="상품 검색">
        <button id="search-button">검색</button>
    </div>

    <div id="auth-buttons">
        <button onclick="location.href='/login.html'">로그인</button>
        <button onclick="location.href='/signup.html'">회원가입</button>
    </div>

    <div id="user-info">
        <span id="username"></span>
        <span id="user-cash"></span>
        <button class="menu-button" id="menu-btn">메뉴</button>
        <div id="user-menu"></div>
    </div>
</div>

<div id="content">
    <h1>상품 목록</h1>

    <div id="sorting-options">
        <span id="sort-by-name">이름순</span>
        <span id="sort-by-price">가격순</span>
    </div>

    <div id="product-list"></div>
</div>

<script>
    async function loadUserInfo() {
        const authButtons = document.getElementById("auth-buttons");
        const userInfo = document.getElementById("user-info");
        const userMenu = document.getElementById("user-menu");
        const usernameElem = document.getElementById("username");
        const userCashElem = document.getElementById("user-cash");

        try {
            // 로컬 스토리지에서 사용자 정보 확인
            console.log("local storage저장 완료")
            // 로컬 스토리지에 사용자 정보가 없는 경우 API 호출
            const userResponse = await fetch("/api/v1/user");
            if (!userResponse.ok) throw new Error("Unauthorized");

            user = await userResponse.json();

            // 사용자 정보를 로컬 스토리지에 저장
            localStorage.setItem('user', JSON.stringify(user));

            // 사용자 정보 표시
            authButtons.style.display = "none";
            userInfo.style.display = "flex";
            usernameElem.innerText = user.name;
            userCashElem.innerText = `캐시: ${user.cash.toLocaleString()}원`;

            userMenu.innerHTML = user.role === "seller" ? `
                <a href="/product/register.html">상품 추가</a>
                <a href="/product/manage.html">상품 관리</a>
                <a href="/order/manage.html">주문 관리</a>
                <a href="/profile.html">정보 관리</a>
                <a href="#" onclick="logout()">로그아웃</a>
            ` : `
                <a href="/payment/charge.html">캐시 충전</a>
                <a href="/order/list.html">주문 내역</a>
                <a href="/profile.html">정보 관리</a>
                <a href="#" onclick="logout()">로그아웃</a>
            `;
        } catch (error) {
            authButtons.style.display = "flex";
            userInfo.style.display = "none";
            // 오류 발생 시 로컬 스토리지에서 사용자 정보 제거
            localStorage.removeItem('user');
        }
    }

    async function loadProducts() {
        try {
            const productResponse = await fetch("/api/v1/products");
            if (!productResponse.ok) throw new Error("상품을 불러오지 못했습니다.");
            const productData = await productResponse.json();
            const productList = document.getElementById("product-list");
            productList.innerHTML = "";
            productData.products.forEach(product => {
                const item = document.createElement("div");
                item.className = "product-item";
                item.innerHTML = `
                    <div class="product-image">상품<br>이미지</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${product.price.toLocaleString()}원</div>
                    </div>
                `;
                item.onclick = () => location.href = `/product-detail.html?id=${encodeURIComponent(product.id)}`;
                productList.appendChild(item);
            });
        } catch (error) {
            alert(error.message);
        }
    }

    function searchProducts() {
        const searchTerm = document.getElementById("search-input").value.trim();
        if (searchTerm) {
            window.location.href = `/search.html?q=${encodeURIComponent(searchTerm)}`;
        }
    }

    function logout() {
        fetch("/api/v1/logout", { method: "POST" })
            .then(() => window.location.href = "/login.html");
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadUserInfo();
        loadProducts();

        // 검색 버튼 클릭 이벤트
        document.getElementById("search-button").addEventListener("click", searchProducts);

        // 엔터 키 검색 이벤트
        document.getElementById("search-input").addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                searchProducts();
            }
        });

        document.getElementById("menu-btn").addEventListener("click", (event) => {
            event.stopPropagation();
            const menu = document.getElementById("user-menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest("#user-info")) {
                document.getElementById("user-menu").style.display = "none";
            }
        });

        // 정렬 버튼 이벤트
        document.getElementById('sort-by-name').addEventListener('click', () => {
            const productList = document.getElementById('product-list');
            const items = Array.from(productList.children);
            items.sort((a, b) => {
                const nameA = a.querySelector('.product-name').innerText;
                const nameB = b.querySelector('.product-name').innerText;
                return nameA.localeCompare(nameB);
            });
            productList.innerHTML = '';
            items.forEach(item => productList.appendChild(item));
        });

        document.getElementById('sort-by-price').addEventListener('click', () => {
            const productList = document.getElementById('product-list');
            const items = Array.from(productList.children);
            items.sort((a, b) => {
                const priceA = parseInt(a.querySelector('.product-price').innerText.replace(/[^0-9]/g, ''));
                const priceB = parseInt(b.querySelector('.product-price').innerText.replace(/[^0-9]/g, ''));
                return priceA - priceB;
            });
            productList.innerHTML = '';
            items.forEach(item => productList.appendChild(item));
        });
    });
</script>
</body>
</html>
