<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐시 충전</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        select, button { width: 100%; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>캐시 충전</h2>
    <label for="amount">충전 금액 선택:</label>
    <select id="amount">
        <option value="5000">5,000원</option>
        <option value="10000">10,000원</option>
        <option value="50000">50,000원</option>
        <option value="100000">100,000원</option>
    </select>
    <button onclick="goToCheckout()">충전하기</button>
</div>

<script>
    function goToCheckout() {
        let amount = document.getElementById("amount").value;
        window.location.href = "/payment/checkout.html?amount=" + amount;
    }
</script>
</body>
</html>
